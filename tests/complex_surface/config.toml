# The routines Revare's complex surface calls besides the arithmetic and elementary functions
# (Ingrid/lapila/complex.lpa): sums, scalings, sign changes, equality, classification, hashing, conversions, and text.

[package]
name = "complex_surface"
version = "0.1.0"
lapila-version = "0.5.0"

[target]
executable = "main.lpa"
sources = ["../../lapila/complex.lpa", "../../lapila/finite.lpa", "../../lapila/words.lpa", "../../lapila/hash.lpa",
    "../../lapila/floattext.lpa", "../../lapila/floattext_tables.lpa", "../../lapila/binfloat_ops.lpa",
    "../../lapila/decimal_exports/dec_exports.lpa", "../../lapila/decimal_exports/dec_surface_exports.lpa"]
