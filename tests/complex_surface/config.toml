# The routines Revare's complex surface calls besides the arithmetic and elementary functions
# (Ingrid/lapila/complex.li): sums, scalings, sign changes, equality, classification, hashing, conversions, and text.

[package]
name = "complex_surface"
version = "0.1.0"
lapila-version = "0.5.0"

[target]
executable = "main.li"
sources = ["../../lapila/complex.li", "../../lapila/finite.li", "../../lapila/words.li", "../../lapila/hash.li",
    "../../lapila/floattext.li", "../../lapila/floattext_tables.li", "../../lapila/binfloat_ops.li",
    "../../lapila/decimal_exports/dec_exports.li", "../../lapila/decimal_exports/dec_surface_exports.li"]
