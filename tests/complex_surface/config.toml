# The routines RazorForge's complex surface calls besides the arithmetic and elementary functions
# (Ingrid/tessera/complex.te): sums, scalings, sign changes, equality, classification, hashing, conversions, and text.

[package]
name = "complex_surface"
version = "0.1.0"
tessera-version = "0.5.0"

[target]
executable = "main.te"
sources = ["../../tessera/complex.te", "../../tessera/finite.te", "../../tessera/words.te", "../../tessera/hash.te",
    "../../tessera/floattext.te", "../../tessera/floattext_tables.te", "../../tessera/binfloat_ops.te",
    "../../tessera/decimal_exports/dec_exports.te", "../../tessera/decimal_exports/dec_surface_exports.te"]
