# The exact binary-float operations Ingrid exports for B32, B64, and B128 (binfloat_ops.lpa): rem, scalbn,
# nextafter, ilogb, and B128 midpoint, nextafter, frexp, and logb.

[package]
name = "binfloat_exact"
version = "0.1.0"
lapila-version = "0.5.0"

[target]
executable = "main.lpa"
sources = ["../../lapila/binfloat_ops.lpa", "../../lapila/words.lpa"]
