# The text pattern exports (Ingrid/lapila/patterns.lpa): a piece tree and a regular expression compiled through the
# encoded characters Revare's Text holds, searches over code points and bytes, the capture slots coming back
# encoded, and the messages of a tree and an expression that don't compile.

[package]
name = "patterns"
version = "0.1.0"
lapila-version = "0.5.0"

[target]
executable = "main.lpa"
sources = ["../../lapila/patterns.lpa"]
