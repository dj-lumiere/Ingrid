# The text pattern exports (Ingrid/tessera/patterns.te): a piece tree and a regular expression compiled through the
# encoded characters RazorForge's Text holds, searches over code points and bytes, the capture slots coming back
# encoded, and the messages of a tree and an expression that don't compile.

[package]
name = "patterns"
version = "0.1.0"
tessera-version = "0.5.0"

[target]
executable = "main.te"
sources = ["../../tessera/patterns.te"]
