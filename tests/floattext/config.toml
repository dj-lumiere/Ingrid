# The text of the binary floats and decimals (Ingrid/tessera/floattext.te, decimal/dec_text.te) and the B128
# arithmetic exports (binfloat_ops.te).

[package]
name = "floattext"
version = "0.1.0"
tessera-version = "0.5.0"

[target]
executable = "main.te"
sources = ["../../tessera/floattext.te", "../../tessera/floattext_tables.te", "../../tessera/binfloat_ops.te",
    "../../tessera/decimal/dec_text.te", "../../tessera/words.te"]
