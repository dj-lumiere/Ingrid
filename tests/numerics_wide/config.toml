# Int (Ingrid/lapila/integer/) through the C ABI on large and edge operands: the sizes around the multiply and
# divide switch points, mixed sizes, special limb patterns, text, shifts, powers and the scratch protocol.

[package]
name = "numerics_wide"
version = "0.1.0"
lapila-version = "0.5.0"

[target]
mode = "release"
executable = "main.lpa"
sources = ["../../lapila/integer_exports/integer_exports.lpa", "../../lapila/divide.lpa",
    "../../lapila/random.lpa", "../../lapila/words.lpa", "../../lapila/memory.lpa"]
