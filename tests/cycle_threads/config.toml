# The cycle collector (Ingrid/tessera/cycle.te) running passes while other threads share, release and drop cycles;
# roam.te calls the deadlock detector, so it is built in too.

[package]
name = "cycle_threads"
version = "0.1.0"
tessera-version = "0.5.0"

[target]
executable = "main.te"
sources = ["../../tessera/cycle.te", "../../tessera/roam.te", "../../tessera/deadlock.te"]
