# The cycle collector (Ingrid/lapila/cycle.li) running passes while other threads share, release and drop cycles;
# roam.li calls into the cycle collector, so it is built in too.

[package]
name = "cycle_threads"
version = "0.1.0"
lapila-version = "0.5.0"

[target]
executable = "main.li"
sources = ["../../lapila/cycle.li", "../../lapila/roam.li"]
