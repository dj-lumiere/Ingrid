# The cycle collector (Ingrid/tessera/cycle.tess) running passes while other threads share, release and drop cycles;
# roam.tess calls the deadlock detector, so it is built in too.

[package]
name = "cycle_threads"
version = "0.1.0"
tessera-version = "0.5.0"

[target]
executable = "main.tess"
sources = ["../../tessera/cycle.tess", "../../tessera/roam.tess", "../../tessera/deadlock.tess"]
