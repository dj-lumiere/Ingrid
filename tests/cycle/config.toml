# The cycle collector (Ingrid/tessera/cycle.tess) on one thread, over the Roamed runtime (roam.tess) it works with;
# roam.tess calls the deadlock detector, so it is built in too.

[package]
name = "cycle"
version = "0.1.0"
tessera-version = "0.1.0"

[target]
executable = "main.tess"
sources = ["../../tessera/cycle.tess", "../../tessera/roam.tess", "../../tessera/deadlock.tess"]
