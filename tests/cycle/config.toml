# The cycle collector (Ingrid/tessera/cycle.te) on one thread, over the Roamed runtime (roam.te) it works with;
# roam.te calls into the cycle collector, so it is built in too.

[package]
name = "cycle"
version = "0.1.0"
tessera-version = "0.5.0"

[target]
executable = "main.te"
sources = ["../../tessera/cycle.te", "../../tessera/roam.te"]
