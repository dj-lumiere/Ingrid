# The cycle collector (Ingrid/lapila/cycle.lpa) on one thread, over the Roamed runtime (roam.lpa) it works with;
# roam.lpa calls into the cycle collector, so it is built in too.

[package]
name = "cycle"
version = "0.1.0"
lapila-version = "0.5.0"

[target]
executable = "main.lpa"
sources = ["../../lapila/cycle.lpa", "../../lapila/roam.lpa", "../../lapila/slots.lpa"]
