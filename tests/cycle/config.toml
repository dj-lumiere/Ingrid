# The cycle collector (Ingrid/lapila/cycle.li) on one thread, over the Roamed runtime (roam.li) it works with;
# roam.li calls into the cycle collector, so it is built in too.

[package]
name = "cycle"
version = "0.1.0"
lapila-version = "0.5.0"

[target]
executable = "main.li"
sources = ["../../lapila/cycle.li", "../../lapila/roam.li"]
