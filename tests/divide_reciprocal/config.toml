# The reciprocal behind Ingrid's word division (Ingrid/lapila/divide.li) where it is computed: every architecture
# but x86-64, so divide_reciprocal.arch lists the ones CI runs it on.

[package]
name = "divide_reciprocal"
version = "0.1.0"
lapila-version = "0.5.0"

[target]
executable = "main.li"
sources = ["../../lapila/divide.li"]
