# The reciprocal behind Ingrid's word division (Ingrid/tessera/divide.tess) where it is computed: every architecture
# but x86-64, so divide_reciprocal.arch lists the ones CI runs it on.

[package]
name = "divide_reciprocal"
version = "0.1.0"
tessera-version = "0.1.0"

[target]
executable = "main.tess"
sources = ["../../tessera/divide.tess"]
