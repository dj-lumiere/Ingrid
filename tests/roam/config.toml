# The Roamed entity runtime (Ingrid/lapila/roam.lpa) on one thread: counts, weak observers, promotion, the lock.
# roam.lpa calls into the cycle collector, so it is built in too, and gives a header back to its slot (slots.lpa).

[package]
name = "roam"
version = "0.1.0"
lapila-version = "0.5.0"

[target]
executable = "main.lpa"
sources = ["../../lapila/roam.lpa", "../../lapila/cycle.lpa", "../../lapila/slots.lpa"]
