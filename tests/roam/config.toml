# The Roamed entity runtime (Ingrid/tessera/roam.tess) on one thread: counts, weak observers, promotion, the lock.
# roam.tess calls into the cycle collector and the deadlock detector, so they are built in too.

[package]
name = "roam"
version = "0.1.0"
tessera-version = "0.1.0"

[target]
executable = "main.tess"
sources = ["../../tessera/roam.tess", "../../tessera/cycle.tess", "../../tessera/deadlock.tess"]
