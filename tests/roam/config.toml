# The Roamed entity runtime (Ingrid/lapila/roam.li) on one thread: counts, weak observers, promotion, the lock.
# roam.li calls into the cycle collector, so it is built in too.

[package]
name = "roam"
version = "0.1.0"
lapila-version = "0.5.0"

[target]
executable = "main.li"
sources = ["../../lapila/roam.li", "../../lapila/cycle.li"]
