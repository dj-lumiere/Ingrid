# The Roamed entity runtime (Ingrid/tessera/roam.te) on one thread: counts, weak observers, promotion, the lock.
# roam.te calls into the cycle collector and the deadlock detector, so they are built in too.

[package]
name = "roam"
version = "0.1.0"
tessera-version = "0.5.0"

[target]
executable = "main.te"
sources = ["../../tessera/roam.te", "../../tessera/cycle.te", "../../tessera/deadlock.te"]
