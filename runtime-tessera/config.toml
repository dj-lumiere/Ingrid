# Ingrid's runtime code in Tessera, built as a library: no executable, so the builder writes the sources as LLVM IR
# (build/ingrid_runtime_tessera.ll), every routine keeping a frame record. A program that reads its crash trace from
# the stack walks through the runtime's frames when the runtime calls it back (a Work, a crash the runtime raises).
# The standard library's exports come along: the B16 and BF16 conversions LLVM calls on Windows, which the JIT
# resolves from this library. Its default crash handler gives way to the runtime's own. Tessera's crash trace stays
# out: RazorForge keeps its own, which the runtime's crash handler reads.

[package]
name = "ingrid_runtime_tessera"

[target]
sources = ["."]
mode = "release"

[debug]
trace = false
